name: Repository harness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full library harness
        run: python3 -B scripts/harness/run.py full
      - name: Check active work scope
        run: python3 -B scripts/harness/run.py ci-scope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: target/harness/*.json
          if-no-files-found: warn
